<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micropage E-Sparepart System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .4s ease-out both}
    @keyframes slideRight{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
    .slide-right{animation:slideRight .3s ease-out both}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
    .shake{animation:shake .4s ease-in-out}
    @keyframes pop{0%{transform:scale(1)}50%{transform:scale(.97)}100%{transform:scale(1)}}
    .pop:active{animation:pop .12s ease-out}
  </style>
</head>
<body class="bg-slate-950 min-h-screen antialiased">

  <!-- TOAST CONTAINER -->
  <div id="toast-box" class="fixed top-5 right-5 z-[999] flex flex-col gap-3 pointer-events-none"></div>

  <!-- ======================== LOGIN ======================== -->
  <section id="login-section" class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background -->
    <div class="absolute inset-0 bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_rgba(37,99,235,0.12),_transparent_60%)]"></div>

    <!-- Card -->
    <div class="relative z-10 w-full max-w-sm mx-4">
      <div id="login-card" class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-8 fade-up">

        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
          <div class="mb-4">
            <img id="logo-img"
              src="https://wsrv.nl/?url=https://drive.google.com/uc?id=1BvqNP_DLYxxuomO-153Vj4FSp54lae8m"
              alt="Logo Micropage"
              class="w-16 h-16 rounded-2xl object-cover shadow-lg shadow-blue-900/30 border border-slate-800"
              onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')" />
            <div class="hidden w-16 h-16 rounded-2xl bg-blue-600 items-center justify-center shadow-lg shadow-blue-900/30">
              <i data-lucide="wrench" class="text-white" style="width:30px;height:30px"></i>
            </div>
          </div>
          <h1 class="text-white text-xl font-extrabold tracking-tight">Micropage E-Sparepart</h1>
          <p class="text-slate-400 text-xs mt-1 font-medium">Masuk ke Dashboard Anda</p>
        </div>

        <!-- Form -->
        <form id="login-form" class="space-y-4" autocomplete="off">
          <div>
            <label class="text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5 block">Username</label>
            <input id="inp-user" type="text" required autofocus
              class="w-full px-4 py-3 rounded-xl bg-slate-800/60 border border-slate-700 text-white text-sm placeholder-slate-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all"
              placeholder="Masukkan username" />
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5 block">Password</label>
            <input id="inp-pass" type="password" required
              class="w-full px-4 py-3 rounded-xl bg-slate-800/60 border border-slate-700 text-white text-sm placeholder-slate-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all"
              placeholder="Masukkan password" />
          </div>
          <button id="btn-login" type="submit"
            class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm tracking-wide transition-all pop focus:outline-none focus:ring-2 focus:ring-blue-500/40 disabled:opacity-40 disabled:cursor-not-allowed mt-2">
            <span id="lbl-masuk">MASUK</span>
            <span id="lbl-load" class="hidden items-center justify-center gap-2">
              <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              Memproses…
            </span>
          </button>
        </form>
      </div>
      <p class="text-center text-[11px] text-slate-600 mt-5">&copy; 2026 Departemen Engineering</p>
    </div>
  </section>

  <!-- ======================== DASHBOARD ======================== -->
  <section id="dash-section" class="hidden min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-20">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
        <!-- Kiri: Logo + Info -->
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shrink-0 shadow-md shadow-blue-900/30 border border-blue-500/30">
            <i data-lucide="wrench" class="text-white" style="width:18px;height:18px"></i>
          </div>
          <div class="min-w-0">
            <h2 class="text-white font-bold text-sm leading-tight truncate">Micropage E-Sparepart</h2>
            <div class="flex items-center gap-2 mt-0.5">
              <span id="badge-role" class="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md leading-normal"></span>
              <span id="dash-name" class="text-slate-400 text-xs truncate leading-normal"></span>
            </div>
          </div>
        </div>
        <!-- Kanan: Logout -->
        <button id="btn-logout"
          class="px-5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-red-400 text-xs font-bold transition-all pop border border-slate-700 hover:border-red-500/30 shrink-0">
          <span class="flex items-center gap-1.5"><i data-lucide="log-out" style="width:14px;height:14px"></i> Logout</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 py-8 space-y-6">

      <!-- Greeting -->
      <div class="fade-up">
        <p id="greet-title" class="text-2xl sm:text-3xl font-black text-white leading-tight"></p>
        <p class="text-sm text-slate-400 mt-1 font-medium">Selamat bertugas. Pantau ketersediaan sparepart dan kelola pengajuan dengan mudah.</p>
      </div>

      <!-- Search Bar -->
      <div class="max-w-md">
        <div class="relative">
          <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" style="width:16px;height:16px"></i>
          <input id="inp-search" type="text"
            class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white text-sm placeholder-slate-500 outline-none focus:border-blue-500/60 transition-all"
            placeholder="Cari menu…" />
        </div>
      </div>

      <!-- Menu Cards Grid -->
      <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

      <!-- Empty State -->
      <div id="empty-msg" class="hidden text-center py-20">
        <i data-lucide="layout-grid" class="mx-auto text-slate-700 mb-3" style="width:48px;height:48px"></i>
        <p class="text-slate-500 font-medium text-sm">Menu tidak ditemukan</p>
      </div>
    </main>

    <footer class="text-center text-[11px] text-slate-600 py-4 border-t border-slate-900">
      &copy; 2026 Developed by Mochammad Fadhilah Hakim
    </footer>
  </section>

  <!-- ======================== JAVASCRIPT ======================== -->
  <script>
    // =================== KONFIGURASI ===================
    const API = (location.protocol === 'file:') ? 'http://localhost:3000' : location.origin;

    // Link Google Sheets dari Aps Script CP (docx)
    const SHEETS = {
      onHandStock:  'https://docs.google.com/spreadsheets/d/10yd6CsgSB1grnpwKmiHLUW7XbVZ2-DlvyqAAQ_YUUlM/edit',
      bqMonitoring: 'https://docs.google.com/spreadsheets/d/10hViWt1FCgadcysrFky8oYQKplox2rX5LkIyDP_L-Aw/edit',
      criticalPart: 'https://docs.google.com/spreadsheets/d/1ZxO9v2JD2ImmwaeSWYUhDg2fCOOBoizJ1s4CwiyQ5AU/edit',
      prSummary:    'https://docs.google.com/spreadsheets/d/1-dQuO-dirpd7144O3pZq8VkGXSA12p4ZTEYRJJJN7zc/edit',
    };

    // Warna badge per role
    const BADGE = {
      'teknisi':     'bg-emerald-600 text-emerald-100',
      'supervisor':  'bg-amber-600   text-amber-100',
      'officer':     'bg-indigo-600  text-indigo-100',
      'manager':     'bg-purple-600  text-purple-100',
    };

    // =================== STATE ===================
    let user = null;

    // =================== HELPERS ===================
    const $ = (id) => document.getElementById(id);

    function greet() {
      const h = new Date().getHours();
      if (h >= 5  && h < 11) return 'Selamat Pagi';
      if (h >= 11 && h < 15) return 'Selamat Siang';
      if (h >= 15 && h < 18) return 'Selamat Sore';
      return 'Selamat Malam';
    }

    function sheetUrl(url) {
      if (!url) return '#';
      return url.includes('spreadsheets') ? url + '?rm=minimal' : url;
    }

    // =================== TOAST ===================
    function toast(msg, ok) {
      const box = $('toast-box');
      const el = document.createElement('div');
      const cls = ok
        ? 'bg-emerald-600 border-emerald-500'
        : 'bg-rose-600 border-rose-500';
      const icon = ok ? 'check-circle' : 'alert-triangle';
      el.className = 'pointer-events-auto slide-right flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl border text-white max-w-sm ' + cls;
      el.innerHTML =
        '<i data-lucide="' + icon + '" style="width:18px;height:18px"></i>' +
        '<span class="text-sm font-semibold flex-1">' + msg + '</span>' +
        '<button onclick="this.closest(\'.slide-right\').remove()" class="text-white/60 hover:text-white shrink-0">' +
        '<i data-lucide="x" style="width:14px;height:14px"></i></button>';
      box.appendChild(el);
      lucide.createIcons({ nodes: [el] });
      setTimeout(() => { if (el.parentElement) el.remove(); }, 5000);
    }

    // =================== RBAC MENU ===================
    function getMenu(role, bqLink) {
      const r = (role || '').toLowerCase();
      const items = [];

      // --- TEKNISI ---
      if (r === 'teknisi') {
        items.push({
          title: 'BQ Personal',
          desc: 'Input pengajuan barang baru',
          icon: 'file-plus',
          bg: 'bg-blue-600',
          url: sheetUrl(bqLink),
        });
        items.push({
          title: 'On Hand Stock',
          desc: 'Cek ketersediaan stok sparepart',
          icon: 'package',
          bg: 'bg-amber-500',
          url: sheetUrl(SHEETS.onHandStock),
        });
      }

      // --- SUPERVISOR / MANAGER / OFFICER ---
      if (r.startsWith('supervisor') || r === 'manager' || r === 'officer') {
        items.push({
          title: 'PR Summary',
          desc: 'Ringkasan Purchase Request',
          icon: 'clipboard-list',
          bg: 'bg-cyan-600',
          url: sheetUrl(SHEETS.prSummary),
        });
        items.push({
          title: 'BQ Monitoring',
          desc: 'Pantau seluruh pengajuan barang',
          icon: 'activity',
          bg: 'bg-emerald-600',
          url: sheetUrl(SHEETS.bqMonitoring),
        });
        items.push({
          title: 'Critical Part List',
          desc: 'Daftar sparepart kritis',
          icon: 'alert-triangle',
          bg: 'bg-rose-500',
          url: sheetUrl(SHEETS.criticalPart),
        });
      }

      return items;
    }

    // =================== RENDER MENU ===================
    function renderMenu(q) {
      if (!user) return;
      const filter = (q || '').toLowerCase();
      const items = getMenu(user.role, user.bqLink)
        .filter(i => !filter || i.title.toLowerCase().includes(filter) || i.desc.toLowerCase().includes(filter));

      const grid = $('menu-grid');
      const empty = $('empty-msg');

      if (!items.length) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      grid.innerHTML = items.map((m, i) =>
        '<a href="' + m.url + '" target="_blank" rel="noopener noreferrer" ' +
        'class="' + m.bg + ' group relative overflow-hidden p-6 rounded-2xl shadow-lg hover:shadow-xl ' +
        'transition-all duration-300 flex flex-col items-start justify-between h-44 w-full text-left pop fade-up" ' +
        'style="animation-delay:' + (i * 70) + 'ms">' +
          '<div class="absolute -top-5 -right-5 w-28 h-28 bg-white opacity-10 rounded-full group-hover:scale-150 transition-transform duration-700"></div>' +
          '<div class="z-10 bg-white/20 p-3 rounded-xl backdrop-blur-md ring-1 ring-white/30">' +
            '<i data-lucide="' + m.icon + '" class="text-white" style="width:26px;height:26px"></i>' +
          '</div>' +
          '<div class="z-10">' +
            '<h3 class="font-bold text-white text-lg leading-tight mb-1">' + m.title + '</h3>' +
            '<p class="text-white/70 text-xs font-medium leading-tight line-clamp-2">' + m.desc + '</p>' +
          '</div>' +
        '</a>'
      ).join('');

      lucide.createIcons();
    }

    // =================== TAMPILKAN DASHBOARD ===================
    function showDash(u) {
      user = u;
      $('login-section').classList.add('hidden');
      $('dash-section').classList.remove('hidden');

      $('dash-name').textContent = u.name;

      const b = $('badge-role');
      b.textContent = u.role;
      var badgeKey = u.role.toLowerCase();
      if (badgeKey.startsWith('supervisor')) badgeKey = 'supervisor';
      b.className = (BADGE[badgeKey] || 'bg-slate-600 text-slate-100') +
        ' text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md leading-normal';

      $('greet-title').textContent = greet() + ', ' + u.name + '! 👋';
      $('inp-search').value = '';
      renderMenu('');
      lucide.createIcons();
    }

    // =================== TAMPILKAN LOGIN ===================
    function showLogin() {
      user = null;
      $('dash-section').classList.add('hidden');
      $('login-section').classList.remove('hidden');
      $('inp-user').value = '';
      $('inp-pass').value = '';
      setLoading(false);
      lucide.createIcons();
    }

    function setLoading(on) {
      $('btn-login').disabled = on;
      $('lbl-masuk').classList.toggle('hidden', on);
      $('lbl-load').classList.toggle('hidden', !on);
      $('lbl-load').classList.toggle('inline-flex', on);
    }

    // =================== SESSION ===================
    function loadSession()  { try { const s = sessionStorage.getItem('user'); return s ? JSON.parse(s) : null; } catch { return null; } }
    function saveSession(u) { sessionStorage.setItem('user', JSON.stringify(u)); }
    function clearSession() { sessionStorage.removeItem('user'); }

    // =================== LOGIN HANDLER ===================
    $('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var username = $('inp-user').value.trim();
      var password = $('inp-pass').value;

      if (!username || !password) {
        toast('Username dan password wajib diisi', false);
        return;
      }

      setLoading(true);

      try {
        var res = await fetch(API + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password }),
        });
        var json = await res.json();

        if (res.ok && json.status === 'ok') {
          toast('Login berhasil!', true);
          saveSession(json.data);
          showDash(json.data);
        } else {
          toast(json.message || 'Kombinasi Username atau Password salah', false);
          $('login-card').classList.add('shake');
          setTimeout(function () { $('login-card').classList.remove('shake'); }, 500);
          setLoading(false);
        }
      } catch (err) {
        toast('Gagal terhubung ke server. Pastikan server berjalan.', false);
        setLoading(false);
      }
    });

    // =================== LOGOUT ===================
    $('btn-logout').addEventListener('click', function () {
      clearSession();
      showLogin();
    });

    // =================== SEARCH ===================
    $('inp-search').addEventListener('input', function (e) {
      renderMenu(e.target.value);
    });

    // =================== INIT ===================
    (function () {
      var s = loadSession();
      if (s && s.role) {
        showDash(s);
      } else {
        showLogin();
      }
      lucide.createIcons();
    })();
  </script>
</body>
</html>
